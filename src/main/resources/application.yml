server:
  port: 8080

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  ngrok:
    enabled: true
    domain: operable-commerce-velvet.ngrok-free.dev

  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL}